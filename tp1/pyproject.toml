[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokoban-sia"
version = "0.1.0"
description = "Algoritmos de busqueda para el trabajo practico de SIA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sokoban = "sokoban.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
analysis = [
    "matplotlib>=3.8",
]
visual = [
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
