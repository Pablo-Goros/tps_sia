[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp2-sia"
version = "0.1.0"
description = "Compresor de imagenes con algoritmos geneticos para SIA ITBA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.scripts]
image-ga = "tp2.src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
analysis = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tp2*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["..", "."]
